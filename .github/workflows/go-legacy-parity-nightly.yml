name: Go Legacy Parity Nightly

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  nightly-long-haul:
    name: Nightly Long-Haul Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: src/hst-imager-go/go.sum

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Publish legacy .NET console app
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_OUT="${RUNNER_TEMP}/hst-imager-legacy"
          mkdir -p "${LEGACY_OUT}"
          cd src
          dotnet publish Hst.Imager.ConsoleApp/Hst.Imager.ConsoleApp.csproj -c Release -o "${LEGACY_OUT}"
          echo "HST_IMAGER_LEGACY_BIN=${LEGACY_OUT}/Hst.Imager.ConsoleApp.dll" >> "${GITHUB_ENV}"

      - name: Run nightly parity with artifacts
        shell: bash
        run: |
          set -euo pipefail
          export GOCACHE="${RUNNER_TEMP}/go-build-cache"
          mkdir -p "${GOCACHE}"
          cd src/hst-imager-go
          HST_IMAGER_LEGACY_BIN="${HST_IMAGER_LEGACY_BIN}" \
          HST_PARITY_ARTIFACT_DIR="${RUNNER_TEMP}/parity-artifacts" \
          HST_PARITY_DEEP_FS=1 \
          HST_PARITY_HEAVY=1 \
          HST_PARITY_FUZZ_ROUNDS=36 \
          HST_PARITY_FUZZ_STRICT_HASH=1 \
          HST_PARITY_REQUIRE_NO_SKIP=1 \
          ./scripts/run-nightly-parity.sh

      - name: Upload nightly parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-parity-artifacts
          path: ${{ runner.temp }}/parity-artifacts
          if-no-files-found: warn
