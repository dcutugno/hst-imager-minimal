[package]
name = "hst-imager-dopus"
version = "0.1.0"
description = "DOpus 4.x style file manager for hst-imager-go"
authors = ["hst-imager contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
